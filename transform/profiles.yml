# Connection profile. Every value comes from the environment (see docs/platform-contract.md);
# this file contains no secrets and is safe to ship in the image.
boccob:
  target: "{{ env_var('DBT_TARGET', 'default') }}"
  outputs:
    default: &base           # no authentication (local harness) - user comes from TRINO_USER
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER') }}"
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      database: "{{ env_var('CURATED_CATALOG', 'curated') }}"
      schema: default
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      retries: 3
    password:                # LDAP / password file authentication over TLS
      <<: *base
      method: ldap
      password: "{{ env_var('TRINO_PASSWORD', '') }}"
      http_scheme: https
      cert: "{{ env_var('TRINO_CA_BUNDLE', '') or true }}"
    jwt:                     # service account token (Keycloak) over TLS
      <<: *base
      method: jwt
      jwt_token: "{{ env_var('TRINO_JWT_TOKEN', '') }}"
      http_scheme: https
      cert: "{{ env_var('TRINO_CA_BUNDLE', '') or true }}"
