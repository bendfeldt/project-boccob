[project]
name = "boccob-solution"
version = "0.1.0"
description = "Boccob lakehouse solution: ingestion (dlt), transformation (dbt-trino), governance (OPA, GDPR tooling) and orchestration (Dagster)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dlt[filesystem,s3]==1.32.0",
    "pyiceberg[pyarrow,s3fs,pyiceberg-core]==0.12.0",
    "s3fs==2026.9.0",
    "trino==0.340.0",
    "dbt-core==1.12.7",
    "dbt-trino==1.12.0",
    "dagster==1.13.31",
    "dagster-dbt==0.29.31",
    "dagster-postgres==0.29.31",
    "dagster-k8s==0.29.31",
    "dagster-aws==0.29.31",
    "pyyaml>=6.0",
    "defusedxml==0.7.1",
]

[project.scripts]
lakehouse-ingest = "ingestion.cli:main"
lakehouse-erase = "governance.erasure.cli:main"
lakehouse-maintain = "governance.maintenance.cli:main"
lakehouse-retention = "governance.retention.cli:main"
lakehouse-pii = "governance.classification.cli:main"
lakehouse-migrate = "governance.migrations.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "dagster-webserver==1.13.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakehouse", "ingestion", "governance", "orchestration"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: needs the podman harness (make integration)"]

[tool.dagster]
module_name = "orchestration.definitions"
code_location_name = "boccob_lakehouse"
